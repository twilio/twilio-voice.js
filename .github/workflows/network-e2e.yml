# The reconnection suite cuts the browser container off the network mid-call.
# It therefore runs in a sibling container started by docker compose, not in a
# job `container:`, whose network the Actions runner itself depends on.
name: Network E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  network-e2e:
    name: network-e2e (${{ matrix.browser }}, ${{ matrix.bver }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest-large
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
        bver: [stable]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Artifactory OIDC Auth
        uses: ./.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      - name: Run network reconnection tests
        env:
          BROWSER: ${{ matrix.browser }}
          BVER: ${{ matrix.bver }}
          VENDOR_URL: ${{ vars.VENDOR_URL }}
          VENDOR_AUDIENCE: ${{ vars.VENDOR_URL }}
        run: |
          set -euo pipefail
          # The container installs from the same curated registry as the host.
          NPMRC_FILE="$HOME/.npmrc" \
            docker compose -f tests/docker/docker-compose.yml run --rm networkTests

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-e2e-${{ matrix.browser }}-${{ matrix.bver }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
